<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendari d'exàmens</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#213b45;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#173e46;color:#fff;padding:24px max(18px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}h1{margin:0;font-size:26px}header small{color:#baddd4}main{max-width:1150px;margin:28px auto;padding:0 16px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cad9d7;border-radius:9px;background:white;padding:10px 14px}button:disabled{opacity:.5}header button{background:#245660;color:white;border-color:#66858b}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}.nav{display:flex;align-items:center;gap:12px}.nav h2{width:210px;text-align:center;text-transform:capitalize;font-size:22px}.primary{background:#206c59;color:white;border-color:#206c59;font-weight:700}.calendar{background:white;border:1px solid #dce5e2;border-radius:16px;overflow:hidden;box-shadow:0 10px 26px #1233}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{background:#e6eeeb}.week span{padding:13px;text-align:center;font-weight:700}.day{min-height:126px;border-right:1px solid #e9eeeb;border-top:1px solid #e9eeeb;padding:9px;min-width:0}.day:nth-child(7n){border-right:0}.other{background:#f7f9f8;color:#a3b1ac}.num{font-weight:700;font-size:13px;width:28px;height:28px;display:grid;place-items:center}.today .num{background:#206c59;color:white;border-radius:50%}.event{display:block;width:100%;border:0;border-left:3px solid #b87643;background:#fff0e5;color:#71421f;text-align:left;padding:5px;margin-top:5px;border-radius:4px;font-size:12px;overflow-wrap:anywhere}.event.project{background:#e8effe;color:#354f87;border-color:#6783b1}.event b{display:block}.notice{padding:13px 16px;background:#fff4d8;border-radius:10px;margin-bottom:18px}.notice[hidden],button[hidden]{display:none!important}dialog{border:0;border-radius:18px;box-shadow:0 20px 65px #0005;width:min(450px,calc(100vw - 24px));padding:24px}dialog::backdrop{background:#152e39a1}dialog h2{margin-top:0}form{display:grid;gap:12px}label{display:grid;gap:5px;font-size:14px;font-weight:650}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd9d6;background:white}textarea{resize:vertical;min-height:70px}.actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:10px}.danger{color:#ae3e36;background:#fff1ee;margin-right:auto}.error{color:#af3b30;font-size:13px}.foot{color:#657b79;margin-top:15px;font-size:13px}.detail{white-space:pre-wrap;line-height:1.65}
@media(max-width:650px){header{padding:18px}h1{font-size:20px}.day{min-height:85px;padding:4px 2px}.num{font-size:11px;width:23px;height:23px}.week span{font-size:11px;padding:9px 0}.event{font-size:10px;padding:3px 2px}.event b{display:none}.nav h2{width:160px;font-size:18px}}
</style></head><body>
<header><div><small>ESPAI DE L'ALUMNAT</small><h1>📅 Calendari d'exàmens</h1></div><div><span id="identity"></span> <button id="loginButton">Accés professorat</button></div></header>
<main><p id="notice" class="notice" hidden></p><div class="bar"><div class="nav"><button id="prev" aria-label="Mes anterior">‹</button><h2 id="month"></h2><button id="next" aria-label="Mes següent">›</button><button id="today">Avui</button></div><div><span id="counter"></span> <button class="primary" id="add" hidden>+ Afegir examen</button></div></div>
<div class="calendar"><div class="week"><span>Dl</span><span>Dt</span><span>Dc</span><span>Dj</span><span>Dv</span><span>Ds</span><span>Dg</span></div><div id="days" class="days"></div></div><p class="foot">🟠 Examen &nbsp; 🔵 Entrega / activitat · Consulta pública sense iniciar sessió</p></main>
<dialog id="loginDialog"><h2>Accés d'edició</h2><p>Només els dos comptes autoritzats poden editar el calendari.</p><form id="loginForm"><label>Correu electrònic<input id="email" type="email" autocomplete="username" required></label><label>Contrasenya<input id="password" type="password" autocomplete="current-password" required></label><p class="error" id="loginError"></p><div class="actions"><button type="button" data-close="loginDialog">Cancel·lar</button><button class="primary">Entrar</button></div></form></dialog>
<dialog id="editDialog"><h2 id="editHeading">Nou esdeveniment</h2><form id="editForm"><label>Títol<input id="title" maxlength="100" required placeholder="Examen RA2"></label><label>Data<input id="date" type="date" required></label><label>Hora<input id="time" type="time"></label><label>Mòdul<input id="subject" maxlength="80"></label><label>Grup<input id="group" maxlength="60"></label><label>Tipus<select id="kind"><option value="exam">Examen</option><option value="project">Entrega / activitat</option></select></label><label>Observacions<textarea id="notes" maxlength="1000"></textarea></label><p class="error" id="editError"></p><div class="actions"><button type="button" id="delete" class="danger" hidden>Eliminar</button><button type="button" data-close="editDialog">Cancel·lar</button><button class="primary">Desar</button></div></form></dialog>
<dialog id="detailDialog"><h2 id="detailHeading"></h2><div id="detail" class="detail"></div><div class="actions"><button id="editSelected" class="primary" hidden>Editar</button><button type="button" data-close="detailDialog">Tancar</button></div></dialog>
<script type="module">
// Configuració pública de l'aplicació web Firebase: omple aquests valors.
// No hi posis contrasenyes ni claus privades.
const firebaseConfig={apiKey:"AIzaSyB3vKsazQ5zpj_6JpbMoU0U4TBOE1kitpw",authDomain:"calendari-examens.firebaseapp.com",projectId:"calendari-examens",storageBucket:"calendari-examens.firebasestorage.app",messagingSenderId:"344853888949",appId:"1:344853888949:web:257e669df2621a1e5ea3fc"};
// UID dels dos editors autoritzats. La protecció real és a firestore.rules.
const AUTHORIZED_UIDS=["l3RZT3v74EdhxN2zzJieyDE6McR2","ROcZ8a9vCMcJxju9Q8YL9HFqQE62"];
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const $=s=>document.getElementById(s),ready=!firebaseConfig.apiKey.startsWith("SUBSTITUEIX_");
let auth,db,user=null,events=[],selected=null,editId=null,view=new Date();view=new Date(view.getFullYear(),view.getMonth(),1);
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
const canEdit=()=>!!user&&AUTHORIZED_UIDS.includes(user.uid);
function notice(s){$("notice").textContent=s;$("notice").hidden=!s}
function render(){
const y=view.getFullYear(),m=view.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,total=Math.ceil((start+new Date(y,m+1,0).getDate())/7)*7;
$("month").textContent=new Intl.DateTimeFormat("ca-ES",{month:"long",year:"numeric"}).format(view);
const parent=$("days");parent.replaceChildren();
for(let i=0;i<total;i++){const d=new Date(y,m,i-start+1),day=iso(d),cell=document.createElement("div");cell.className="day"+(d.getMonth()===m?"":" other")+(day===iso(new Date())?" today":"");
const n=document.createElement("div");n.className="num";n.textContent=d.getDate();cell.append(n);
events.filter(e=>e.date===day).sort((a,b)=>(a.time||"").localeCompare(b.time||"")).forEach(e=>{const b=document.createElement("button");b.className="event"+(e.kind==="project"?" project":"");const t=document.createElement("b");t.textContent=e.time||"Tot el dia";const x=document.createElement("span");x.textContent=e.title;b.append(t,x);b.onclick=()=>show(e);cell.append(b)});
if(canEdit()&&d.getMonth()===m)cell.ondblclick=e=>{if(!e.target.closest(".event"))editor(null,day)};
parent.append(cell)}
const count=events.filter(e=>e.date?.startsWith(y+"-"+String(m+1).padStart(2,"0"))).length;
$("counter").textContent=count+" esdeveniments";
$("add").hidden=!canEdit();$("editSelected").hidden=!canEdit();$("identity").textContent=canEdit()?"Mode editor":"";$("loginButton").textContent=user?"Tancar sessió":"Accés professorat";
}
function show(e){selected=e;$("detailHeading").textContent=e.title;$("detail").replaceChildren();for(const[k,v]of Object.entries({Data:e.date,Hora:e.time,Mòdul:e.subject,Grup:e.group,Tipus:e.kind==="project"?"Entrega / activitat":"Examen",Observacions:e.notes})){if(!v)continue;const p=document.createElement("p"),b=document.createElement("b");b.textContent=k+": ";p.append(b,document.createTextNode(v));$("detail").append(p)}$("detailDialog").showModal()}
function editor(e=null,day=iso(new Date())){if(!canEdit())return;editId=e?.id||null;$("editHeading").textContent=e?"Editar esdeveniment":"Afegir esdeveniment";for(const k of ["title","date","time","subject","group","kind","notes"])$(k).value=e?.[k]||(k==="date"?day:k==="kind"?"exam":"");$("delete").hidden=!e;$("editError").textContent="";$("editDialog").showModal()}
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$("today").onclick=()=>{let d=new Date();view=new Date(d.getFullYear(),d.getMonth(),1);render()};$("add").onclick=()=>editor();
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$("loginButton").onclick=async()=>{if(user){await signOut(auth)}else if(!ready)notice("Cal configurar Firebase per activar el calendari. Consulta README.md al repositori.");else $("loginDialog").showModal()};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="";try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("password").value="";$("loginDialog").close()}catch{$("loginError").textContent="No s'ha pogut iniciar la sessió."}};
$("editForm").onsubmit=async e=>{e.preventDefault();if(!canEdit())return;const v=Object.fromEntries(["title","date","time","subject","group","kind","notes"].map(k=>[k,$(k).value.trim()]));if(!v.title||!/^\d{4}-\d{2}-\d{2}$/.test(v.date))return;try{if(editId)await updateDoc(doc(db,"events",editId),v);else await addDoc(collection(db,"events"),{...v,createdAt:serverTimestamp()});$("editDialog").close()}catch{$("editError").textContent="No s'ha pogut desar. Revisa els permisos."}};
$("delete").onclick=async()=>{if(!editId||!canEdit()||!confirm("Eliminar aquest esdeveniment?"))return;try{await deleteDoc(doc(db,"events",editId));$("editDialog").close()}catch{$("editError").textContent="No s'ha pogut eliminar."}};
$("editSelected").onclick=()=>{$("detailDialog").close();editor(selected)};
render();
if(!ready)notice("Calendari pendent de configuració: cal connectar Firebase per mostrar i gestionar els exàmens.");
else try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{user=u;render();if(u&&!canEdit())notice("Aquest compte no està autoritzat per editar.");else notice("")});onSnapshot(collection(db,"events"),snap=>{events=snap.docs.map(d=>({id:d.id,...d.data()}));render()},()=>notice("No s'han pogut carregar els esdeveniments. Revisa Firebase i les regles."))}catch{notice("Error de configuració Firebase. Consulta README.md.")}
</script></body></html>
